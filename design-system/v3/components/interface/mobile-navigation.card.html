<!-- @dsCard group="Interface" viewport="1180x800" name="Mobile navigation" subtitle="Site menu closed and open; app drawer for complex interfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>body{margin:0;padding:24px;background:#050807;color:var(--ink);font-family:var(--f)}.row{display:flex;gap:24px;align-items:flex-start}.ph{width:340px;height:720px;flex:none;border:1px solid var(--line2);border-radius:34px;overflow:hidden}.cap{display:block;margin-top:12px;font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--nevoa)}.light img{filter:invert(1)}</style></head><body><div id="root"></div>
<script type="text/babel">window.NRO_ASSET_BASE='../../../../';const {MobileSiteMenu,MobileAppMenu}=window.NeuroDynamicsDesignSystem_10bbff;
const L=['Início','Quem somos','Projetos','Contato'],F=['Escola de Engenharia, UFMG','hello@neurodynamics.dev','Belo Horizonte, Brasil'];
const S=[{label:'Agenda',icon:'cal'},{label:'Atividades',icon:'board'},{label:'OKRs',icon:'target'},{label:'Projetos',icon:'box'},{label:'Arquivos',icon:'folder'},{label:'Studio',icon:'image',children:[{label:'Quadro'},{label:'Calendário'},{label:'Ideias'},{divider:true},{label:'Criar publicação'},{label:'Modelos'},{divider:true},{label:'Configurações'}]},{label:'Marca',icon:'palette'},{label:'Equipe',icon:'users'},{label:'Treinamentos',icon:'cap'}];
const Home=<div style={{padding:'40px 0 0'}}><h2 style={{margin:0,fontFamily:'var(--fd)',fontWeight:600,fontSize:38,lineHeight:1.02,letterSpacing:'-.025em'}}>Sistemas inteligentes para a saúde humana.</h2><p style={{margin:'24px 0 0',fontSize:16,lineHeight:1.65,color:'var(--nevoa)'}}>A NeuroDynamics é uma <b style={{color:'var(--ink)',fontWeight:600}}>iniciativa sem fins lucrativos</b> que desenvolve software, firmware e dispositivos inteligentes.</p></div>;
const Page=<div style={{padding:'72px 22px 0',display:'flex',flexDirection:'column',gap:14}}><div style={{height:210,borderRadius:22,background:'var(--cortex)'}}></div><div style={{height:90,borderRadius:18,border:'1px solid var(--line)'}}></div></div>;
const Cap=({t,children})=><div><div className="ph">{children}</div><span className="cap">{t}</span></div>;
const TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{"ambient":"Escuro","accent":"#CEDC00","system":"Portal do membro"}/*EDITMODE-END*/;
const LIGHT={'--glow':'#E3EFEC','--void':'#F4F6F5','--painel':'#FFFFFF','--ink':'#0B1210','--nevoa':'#2E3533','--grafite':'#616C68','--line':'rgba(11,18,16,.1)','--line2':'rgba(11,18,16,.2)','--glass':'rgba(255,255,255,.82)'};
function App(){const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);const light=t.ambient==='Claro';
const vars={...(light?LIGHT:{}),'--synapse':light&&t.accent==='#CEDC00'?'#00594F':t.accent};
document.body.style.background=light?'#E6E9E8':'#050807';document.body.style.color=light?'#0B1210':'';
return <div className={'row'+(light?' light':'')} style={vars}><Cap t="Site, fechado"><MobileSiteMenu links={L} footer={F} eyebrow="Iniciativa de P&D em saúde, sem fins lucrativos">{Home}</MobileSiteMenu></Cap><Cap t="Site, aberto"><MobileSiteMenu links={L} footer={F} open active={0}/></Cap><Cap t="Interface complexa"><MobileAppMenu app={t.system} sections={S} active="Studio" activeChild="Quadro" user={{name:'Matheus Marcondes',role:'Administração'}} notifications={3}>{Page}</MobileAppMenu></Cap>
<TweaksPanel><TweakSection label="Atmosfera"/><TweakRadio label="Ambiente" value={t.ambient} options={['Escuro','Claro']} onChange={v=>setTweak('ambient',v)}/><TweakColor label="Marcação ativa" value={t.accent} options={['#CEDC00','#00594F','#A9CCC4']} onChange={v=>setTweak('accent',v)}/><TweakSection label="Identidade"/><TweakSelect label="Sistema" value={t.system} options={['Portal do membro','ERP','Studio']} onChange={v=>setTweak('system',v)}/></TweaksPanel></div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
