<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#050807;color:var(--ink);font-family:var(--f)}.wrap{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:24px}.rows{display:flex;flex-direction:column;gap:20px}.grp{display:flex;flex-direction:column;gap:10px;min-width:0}.g3{display:grid;grid-template-columns:repeat(3,96px);gap:14px}.g3 img{width:96px;height:96px;object-fit:contain;display:block}.rd{width:96px;height:96px;border-radius:50%;overflow:hidden;border:1px solid var(--line2)}.rd img{width:100%;height:100%;object-fit:cover;transform:scale(1.25)}.h{font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--nevoa)}.d{font-size:12px;line-height:1.5;color:var(--nevoa);margin:0;max-width:420px}.int{border-left:1px solid var(--line2);padding-left:20px}.int img{width:96px;height:96px;border-radius:10px}.seals{display:flex;gap:14px;margin-top:4px}.seal{width:150px;height:150px;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center}.seal img{width:134px;height:134px}</style></head><body><div class="grp"><span class="h">Solemn seal, chancellery documents</span><div class="seals"><div class="seal" style="background:var(--axon)"><img src="../../../assets/seal-white.png" alt=""></div><div class="seal" style="background:#FFFFFF;border:1px solid #C4CCC9"><img src="../../../assets/seal-axon.png" alt=""></div></div><p class="d">The wave inside a laurel crown, in white on an Axon ground (negative) and in Axon on white (positive). Certificates, diplomas, honours and official acts only.</p></div></body></html>
