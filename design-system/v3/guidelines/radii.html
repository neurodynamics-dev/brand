<!-- @dsCard group="Spacing" viewport="760x190" name="Corner radii" subtitle="Interface 4 to 24px, formal 2px, no pill shapes" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#050807;color:var(--ink);font-family:var(--f)}.row{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:10px}.sw{display:flex;flex-direction:column;align-items:center;gap:8px}.b{width:60px;height:60px;border:1px solid var(--line2);background:var(--card)}.n{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--nevoa)}.v{font-family:var(--fm);font-size:10px;color:var(--grafite)}.note{margin:18px 0 0;font-size:12px;color:var(--nevoa)}</style></head><body><div class="row"><div class="sw"><div class="b" style="border-radius:4px"></div><span class="n">Badge</span><span class="v">4</span></div><div class="sw"><div class="b" style="border-radius:5px"></div><span class="n">Status, tag</span><span class="v">5</span></div><div class="sw"><div class="b" style="border-radius:6px"></div><span class="n">Chip</span><span class="v">6</span></div><div class="sw"><div class="b" style="border-radius:11px"></div><span class="n">Button, field</span><span class="v">11</span></div><div class="sw"><div class="b" style="border-radius:14px"></div><span class="n">Md</span><span class="v">14</span></div><div class="sw"><div class="b" style="border-radius:18px"></div><span class="n">Card</span><span class="v">18</span></div><div class="sw"><div class="b" style="border-radius:20px"></div><span class="n">Lg</span><span class="v">20</span></div><div class="sw"><div class="b" style="border-radius:24px"></div><span class="n">Xl</span><span class="v">24</span></div><div class="sw"><div class="b" style="border-radius:2px"></div><span class="n">Formal</span><span class="v">2</span></div></div><p class="note">No pill shapes. Only avatars and the spinner are circles.</p></body></html>
