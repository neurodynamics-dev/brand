<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--f);color:#1D1D1F}.hd{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#616C68}.note{font-size:12px;color:#4A4F4D;margin:14px 0 0;max-width:620px;line-height:1.5}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="hd">Light</span><div style="height:72px;border-radius:8px;background:#E3EFEC;color:#00352F;padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px"><span style="font-family:var(--fm);font-size:10px;letter-spacing:.04em">#E3EFEC</span></div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="hd">Medium</span><div style="height:72px;border-radius:8px;background:#A9CCC4;color:#00352F;padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px"><span style="font-family:var(--fm);font-size:10px;letter-spacing:.04em">#A9CCC4</span></div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="hd">Primary</span><div style="height:120px;border-radius:8px;background:#00594F;color:#fff;padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px"><span style="font-family:var(--fd);font-weight:600;letter-spacing:-.015em;font-size:19px;line-height:1">Axon</span><span style="font-family:var(--fm);font-size:10px;letter-spacing:.04em">#00594F</span></div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="hd">Dark</span><div style="height:120px;border-radius:8px;background:#00352F;color:#fff;padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px"><span style="font-family:var(--fd);font-weight:600;letter-spacing:-.015em;font-size:19px;line-height:1">Cortex</span><span style="font-family:var(--fm);font-size:10px;letter-spacing:.04em">#00352F</span></div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="hd">Accent</span><div style="height:120px;border-radius:8px;background:#CEDC00;color:#00352F;padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px"><span style="font-family:var(--fd);font-weight:600;letter-spacing:-.015em;font-size:19px;line-height:1">Synapse</span><span style="font-family:var(--fm);font-size:10px;letter-spacing:.04em">#CEDC00</span></div></div></div><p class="note">Synapse is the accent for Axon, in small doses. This family is the only one allowed in glows, blurs, gradients, glass or transparency. Every other family is plain.</p></body></html>
