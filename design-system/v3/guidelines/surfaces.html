<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#050807;color:var(--ink);font-family:var(--f)}.h{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--nevoa)}.v{font-family:var(--fm);font-size:10.5px;color:var(--nevoa)}.lab{display:inline-flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.lab i{width:7px;height:7px;display:block}</style></head><body><div style="position:relative;overflow:hidden;border-radius:18px;padding:18px;background:radial-gradient(120% 90% at 72% -12%,#081511 0%,var(--void) 58%);border:1px solid var(--line)"><div style="position:absolute;inset:0;background-image:linear-gradient(rgba(245,245,247,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(245,245,247,.05) 1px,transparent 1px);background-size:44px 44px"></div><div style="position:absolute;width:320px;height:320px;left:-80px;top:-180px;border-radius:50%;filter:blur(60px);opacity:.5;background:radial-gradient(circle,var(--axon),transparent 70%)"></div><div style="position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px"><div style="border:1px solid var(--line);border-radius:18px;background:var(--card);padding:16px;display:flex;flex-direction:column;gap:6px;height:120px;box-sizing:border-box"><span style="font-family:var(--fd);font-weight:600;font-size:14px">Card</span><span class="h">line, 3%, r18</span></div><div style="border:1px solid var(--line2);border-radius:18px;background:var(--painel);padding:16px;display:flex;flex-direction:column;gap:6px"><span style="font-family:var(--fd);font-weight:600;font-size:14px">Painel</span><span class="h">line2, raised</span></div><div style="border:1px solid var(--line);border-radius:18px;background:rgba(11,18,16,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:16px;display:flex;flex-direction:column;gap:6px"><span style="font-family:var(--fd);font-weight:600;font-size:14px">Widget</span><span class="h">Sulco 78% · blur 18</span></div><div style="border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:16px;display:flex;flex-direction:column;gap:6px"><span style="font-family:var(--fd);font-weight:600;font-size:14px">Glass</span><span class="h">header, dialog</span></div></div><p style="position:relative;margin:58px 0 0;font-size:12.5px;color:var(--nevoa)">Page: Void with the expressive background (44px grid, Axon blob). No drop shadows for elevation; glass and blur only on primary-set surfaces.</p></div></body></html>
