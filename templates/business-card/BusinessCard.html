<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartão de visita | NeuroDynamics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../design-system/tokens.css">
<style>

    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  
x-dc{display:none!important}
html,body{height:100%;margin:0}#dc-root,#dc-root>.sc-host{height:100%}
body{margin:0;background:#E6E9E8}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f);font-size:var(--fs-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:var(--tr-heading)}
a{color:var(--ion);text-decoration:none}
::selection{background:var(--synapse);color:var(--cortex)}
/* foto: troque o placeholder por <img> com object-fit:cover; sem filtros */
.foto-slot{position:relative;overflow:hidden;background:rgba(127,127,127,.08);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;box-sizing:border-box;font:13px/1.3 'Instrument Sans',system-ui,sans-serif;color:rgba(127,127,127,.9)}
.foto-slot>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* apresentação: slides empilhados; imprima em PDF com uma página por slide */
.deck{display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0}
.deck>section{flex:none}
@media print{@page{size:1920px 1080px;margin:0}body{background:none!important}.deck{gap:0;padding:0}.deck>section{break-after:page}}
</style>
</head>
<body>
<div class="sc-host" data-sc-name="BusinessCard"><div style="display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; padding: 48px;"><section data-screen-label="01 Frente" style="width: 1020px; height: 660px; flex: 0 0 auto; border-radius: 6px; background: rgb(0, 53, 47); display: flex; align-items: center; justify-content: center;"><img src="../../assets/logo-imagotipo-white.png" alt="NeuroDynamics" style="height: 64px;"></section><section data-screen-label="02 Verso" style="width: 1020px; height: 660px; flex: 0 0 auto; border-radius: 6px; background: rgb(255, 255, 255); box-sizing: border-box; padding: 84px 96px; display: flex; flex-direction: column; color: rgb(29, 29, 31); font-family: Archivo, sans-serif; font-weight: 300;"><div style="display: flex; justify-content: space-between; align-items: flex-start;"><div style="display: flex; flex-direction: column; gap: 6px;"><span style="font-family: &quot;Instrument Serif&quot;, Georgia, serif; font-size: 72px; line-height: 1; letter-spacing: -0.01em; color: rgb(0, 53, 47);">Ana Ribeiro</span><span style="font-family: &quot;Instrument Serif&quot;, Georgia, serif; font-size: 36px; line-height: 1.2; color: rgb(0, 89, 79);">Diretora científica</span></div><div role="img" aria-label="NeuroDynamics" style="width: 200px; height: 34px; background: rgb(0, 53, 47); mask: url(&quot;../../assets/logo-imagotipo-black.png&quot;) right center / contain no-repeat;"></div></div><div style="margin-top: auto; padding-top: 28px; border-top: 1px solid rgb(0, 53, 47); display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); gap: 10px 48px; font-size: 26px; line-height: 1.35;"><span>ana@neurodynamics.dev</span><span>+55 31 99812 4407</span><span style="color: rgb(97, 108, 104);">neurodynamics.dev</span><span style="color: rgb(97, 108, 104);">Belo Horizonte, MG</span></div></section></div></div>
</body>
</html>
